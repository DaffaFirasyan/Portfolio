<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      The avatar is this page's largest contentful paint, and it was being
      discovered 880ms late: it is rendered by React, so the browser could not
      see it until the bundle had downloaded, parsed and run. Measured LCP
      breakdown was 880ms of load delay against 220ms of actually loading it.

      Naming it here puts it in the initial document, where the preload scanner
      finds it in the first few bytes. It names the responsive candidates, not
      the 2000px original: a preload of the original would be fetched on top of
      whichever small copy the page then chose. `profile.avatarSrcSet` is the
      source of truth and site.test.ts fails if this drifts from it; `href` is
      only the fallback for a browser that ignores imagesrcset.
    -->
    <link
      rel="preload"
      as="image"
      href="/profile/avatar-960.webp"
      imagesrcset="/profile/avatar-640.webp 640w, /profile/avatar-960.webp 960w, /profile/avatar-1280.webp 1280w"
      imagesizes="(min-width: 1024px) 384px, min(24rem, calc(100vw - 3rem))"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="dns-prefetch" href="https://api.web3forms.com" />
    <link rel="preconnect" href="https://api.web3forms.com" crossorigin />

    <title>Daffa Firasyan — AI/ML Engineer</title>
    <meta name="description" content="Retrieval systems, knowledge graphs and web engineering. Selected projects, certificates and experience from an Information Systems graduate in Bandung." />

    <meta property="og:description" content="Retrieval systems, knowledge graphs and web engineering. Selected projects, certificates and experience from an Information Systems graduate in Bandung." />
    <meta property="og:image" content="https://daffafirasyan.vercel.app/og/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
